name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: RentConnect_Test_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'RentConnect_Test_2026!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore RentConnect.slnx

      - name: Check vulnerable packages
        run: dotnet list RentConnect.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build RentConnect.slnx --configuration Release --no-restore

      - name: Run tests
        env:
          RENTCONNECT_TEST_SQLSERVER: Server=localhost,1433;Database=master;User Id=sa;Password=RentConnect_Test_2026!;Encrypt=True;TrustServerCertificate=True
        run: dotnet test RentConnect.slnx --configuration Release --no-build