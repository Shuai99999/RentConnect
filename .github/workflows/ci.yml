name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore RentConnect.slnx

      - name: Check vulnerable packages
        run: dotnet list RentConnect.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build RentConnect.slnx --configuration Release --no-restore

      - name: Run tests
        run: dotnet test RentConnect.slnx --configuration Release --no-build