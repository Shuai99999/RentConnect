name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      E2E_CONNECTION_STRING: Server=localhost,1433;Database=RentConnect_E2E;User Id=sa;Password=RentConnect_Test_2026!;Encrypt=True;TrustServerCertificate=True
      E2E_TEST_USER_EMAIL: playwright-ci@rentconnect.test
      E2E_TEST_USER_PASSWORD: RentConnect_E2E_2026!

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: RentConnect_Test_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'RentConnect_Test_2026!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore dependencies
        run: dotnet restore RentConnect.slnx

      - name: Check vulnerable packages
        run: dotnet list RentConnect.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build RentConnect.slnx --configuration Release --no-restore

      - name: Run tests
        env:
          RENTCONNECT_TEST_SQLSERVER: Server=localhost,1433;Database=master;User Id=sa;Password=RentConnect_Test_2026!;Encrypt=True;TrustServerCertificate=True
        run: dotnet test RentConnect.slnx --configuration Release --no-build

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: lts/*
          cache: npm

      - name: Install Playwright dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Prepare E2E database
        run: >-
          dotnet run
          --project RentConnect.E2ESupport/RentConnect.E2ESupport.csproj
          --configuration Release
          --no-build

      - name: Run Playwright tests
        env:
          ASPNETCORE_ENVIRONMENT: E2E
          ASPNETCORE_URLS: http://127.0.0.1:5086
          ConnectionStrings__DefaultConnection: ${{ env.E2E_CONNECTION_STRING }}
          Database__ApplyMigrationsOnStartup: "true"
          PLAYWRIGHT_BASE_URL: http://127.0.0.1:5086
          PLAYWRIGHT_START_SERVER: "true"
          PLAYWRIGHT_WEB_SERVER_COMMAND: dotnet run --project RentConnect/RentConnect.csproj --configuration Release --no-build --no-launch-profile
          PLAYWRIGHT_USER_EMAIL: ${{ env.E2E_TEST_USER_EMAIL }}
          PLAYWRIGHT_USER_PASSWORD: ${{ env.E2E_TEST_USER_PASSWORD }}
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
