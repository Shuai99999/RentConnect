# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - rentconnect-shuai-dev-20261017

on:
  push:
    branches:
      - 'main'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read # This is required for actions/checkout

    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: Y
          MSSQL_SA_PASSWORD: RentConnect_Test_2026!
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'RentConnect_Test_2026!' -C -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore solution
        run: dotnet restore RentConnect.slnx

      - name: Build solution
        run: dotnet build RentConnect.slnx --configuration Release --no-restore

      - name: Run tests
        env:
          RENTCONNECT_TEST_SQLSERVER: Server=localhost,1433;Database=master;User Id=sa;Password=RentConnect_Test_2026!;Encrypt=True;TrustServerCertificate=True
        run: dotnet test RentConnect.slnx --configuration Release --no-build

      - name: Publish web app
        run: >-
          dotnet publish ./RentConnect/RentConnect.csproj
          --configuration Release
          --no-build
          --output ${{ env.DOTNET_ROOT }}/myapp

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{ env.DOTNET_ROOT }}/myapp

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write # This is required for requesting the JWT
      contents: read # This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_1B397606CC4A494F8486DB0FCB6E03F5 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_855F3D6803B44B57BF3CED23DD4F93E7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_FBA170A7961B4C17ACC5252639E23C2E }}

      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'rentconnect-shuai-dev-20261017'
          slot-name: 'Production'
          package: .

      - name: Verify deployed application
        shell: bash
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error "${{ steps.deploy-to-webapp.outputs.webapp-url }}/health"; then
              exit 0
            fi
            sleep 10
          done
          echo "The deployed application did not become healthy in time."
          exit 1
